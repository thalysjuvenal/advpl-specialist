name: Validate Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JSON syntax
        run: |
          set -e
          for f in .claude-plugin/*.json; do
            echo "Validating $f"
            jq empty "$f"
          done

      - name: Validate version alignment
        run: |
          set -e
          PLUGIN_VER=$(jq -r '.version' .claude-plugin/plugin.json)
          MARKET_VER=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          MARKET_ROOT_VER=$(jq -r '.version // empty' .claude-plugin/marketplace.json)
          SITE_VER=$(grep -oE "PLUGIN_VERSION = 'v[0-9]+\.[0-9]+\.[0-9]+'" documentation/app/page.tsx | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          README_VER=$(grep -oE "version-[0-9]+\.[0-9]+\.[0-9]+-blue" README.md | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          INDEX_VER=$(grep -oE "version-[0-9]+\.[0-9]+\.[0-9]+-blue" documentation/content/docs/index.mdx | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          echo "plugin.json:             $PLUGIN_VER"
          echo "marketplace.json[0]:     $MARKET_VER"
          echo "marketplace.json root:   $MARKET_ROOT_VER"
          echo "documentation landing:   $SITE_VER"
          echo "README.md badge:         $README_VER"
          echo "docs index.mdx badge:    $INDEX_VER"
          if [ "$PLUGIN_VER" != "$MARKET_VER" ]; then
            echo "ERROR: version mismatch between plugin.json and marketplace.json plugins[0]"
            exit 1
          fi
          if [ -n "$MARKET_ROOT_VER" ] && [ "$MARKET_ROOT_VER" != "$PLUGIN_VER" ]; then
            echo "ERROR: root version in marketplace.json mismatches plugin.json"
            exit 1
          fi
          if [ -n "$SITE_VER" ] && [ "$SITE_VER" != "$PLUGIN_VER" ]; then
            echo "ERROR: documentation/app/page.tsx PLUGIN_VERSION ($SITE_VER) mismatches plugin.json ($PLUGIN_VER)"
            exit 1
          fi
          if [ -n "$README_VER" ] && [ "$README_VER" != "$PLUGIN_VER" ]; then
            echo "ERROR: README.md version badge ($README_VER) mismatches plugin.json ($PLUGIN_VER)"
            exit 1
          fi
          if [ -n "$INDEX_VER" ] && [ "$INDEX_VER" != "$PLUGIN_VER" ]; then
            echo "ERROR: documentation/content/docs/index.mdx version badge ($INDEX_VER) mismatches plugin.json ($PLUGIN_VER)"
            exit 1
          fi

      - name: Validate YAML frontmatter
        run: |
          FAIL=0
          for f in commands/*.md agents/*.md; do
            if ! head -1 "$f" | grep -q "^---$"; then
              echo "ERROR: $f missing frontmatter opener"
              FAIL=1
              continue
            fi
            FM_END=$(awk '/^---$/{c++; if(c==2){print NR; exit}}' "$f")
            if [ -z "$FM_END" ]; then
              echo "ERROR: $f frontmatter not closed"
              FAIL=1
              continue
            fi
            if ! sed -n "2,$((FM_END-1))p" "$f" | python3 -c "import sys, yaml; yaml.safe_load(sys.stdin)" 2>/dev/null; then
              echo "ERROR: $f has invalid YAML frontmatter"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Validate agent frontmatter fields
        run: |
          FAIL=0
          for f in agents/*.md; do
            for field in description tools model; do
              if ! sed -n "/^---$/,/^---$/p" "$f" | grep -q "^${field}:"; then
                echo "ERROR: $f missing required frontmatter field: $field"
                FAIL=1
              fi
            done
          done
          exit $FAIL

      - name: Validate command frontmatter fields
        run: |
          FAIL=0
          for f in commands/*.md; do
            for field in description allowed-tools; do
              if ! sed -n "/^---$/,/^---$/p" "$f" | grep -q "^${field}:"; then
                echo "ERROR: $f missing required frontmatter field: $field"
                FAIL=1
              fi
            done
          done
          exit $FAIL

      - name: Validate skill reference.md size (<= 500 lines)
        run: |
          FAIL=0
          for f in skills/*/reference.md; do
            [ -f "$f" ] || continue
            LINES=$(wc -l < "$f")
            if [ "$LINES" -gt 500 ]; then
              echo "ERROR: $f has $LINES lines (max 500). Move content to supporting files."
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Validate shell scripts syntax
        run: |
          set -e
          for f in hooks/session-start hooks/lib/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "ERROR: $f has syntax errors"; exit 1; }
          done

      - name: Check internal links
        run: |
          FAIL=0
          for f in commands/*.md agents/*.md skills/*/reference.md; do
            [ -f "$f" ] || continue
            DIR=$(dirname "$f")
            while IFS= read -r link; do
              [ -z "$link" ] && continue
              TARGET="$DIR/$link"
              if [ ! -f "$TARGET" ]; then
                echo "BROKEN LINK in $f: $link -> $TARGET"
                FAIL=1
              fi
            done < <(grep -oE '\.\./[a-zA-Z0-9_/.-]+\.md' "$f" || true)
          done
          exit $FAIL

      - name: Validate portable layer (SKILL.md, templates, AI commands)
        run: |
          set -euo pipefail
          fail=0
          # 18 SKILL.md: frontmatter minimo, name == pasta, regex, limites
          count=0
          for d in skills/*/; do
            n=$(basename "$d"); f="${d}SKILL.md"; count=$((count+1))
            [ -f "$f" ] || { echo "FALTA SKILL.md: $n"; fail=1; continue; }
            name=$(awk -F': *' '/^name:/{print $2; exit}' "$f")
            desc=$(awk -F': *' '/^description:/{print $2; exit}' "$f")
            [ "$name" = "$n" ] || { echo "name != pasta em $n ('$name')"; fail=1; }
            echo "$name" | grep -qE '^[a-z0-9-]{1,64}$' || { echo "name invalido: $n"; fail=1; }
            [ -n "$desc" ] || { echo "description vazia: $n"; fail=1; }
            [ ${#desc} -le 1024 ] || { echo "description > 1024: $n"; fail=1; }
          done
          [ "$count" -eq 19 ] || { echo "esperado 19 skills, encontrado $count"; fail=1; }
          # Templates
          [ "$(wc -c < AGENTS.md)" -le 32768 ] || { echo "AGENTS.md > 32 KiB"; fail=1; }
          head -1 CLAUDE.md | grep -qx '@AGENTS.md' || { echo "CLAUDE.md nao inicia com @AGENTS.md"; fail=1; }
          # Comandos multi-IA em sincronia com a fonte canonica
          node scripts/build-ai-commands.mjs --check || fail=1
          exit $fail

      - name: Validate documented counts (README + site)
        run: |
          set -euo pipefail
          fail=0
          CMD=$(ls commands/*.md | wc -l | tr -d ' ')
          AG=$(ls agents/*.md | wc -l | tr -d ' ')
          SK=$(ls -d skills/*/ | wc -l | tr -d ' ')
          SRC=$(ls ai-commands/src/*.md | wc -l | tr -d ' ')
          echo "reais: $CMD commands, $AG agents, $SK skills, $SRC fontes canonicas"
          # fonte canonica multi-IA acompanha commands/
          [ "$CMD" -eq "$SRC" ] || { echo "commands/ ($CMD) != ai-commands/src/ ($SRC)"; fail=1; }
          # README: contagem na arvore e presenca de cada command
          grep -q "# $CMD commands invocaveis" README.md || { echo "README arvore: esperado '# $CMD commands invocaveis'"; fail=1; }
          for f in commands/*.md; do
            grep -q "$(basename "$f")" README.md || { echo "README arvore: falta $(basename "$f")"; fail=1; }
          done
          # Site: tabela "Numeros do plugin" (index.mdx)
          grep -q "| \*\*Comandos\*\* | $CMD |" documentation/content/docs/index.mdx || { echo "index.mdx: contagem de comandos != $CMD"; fail=1; }
          grep -q "| \*\*Agentes\*\* | $AG |" documentation/content/docs/index.mdx || { echo "index.mdx: contagem de agentes != $AG"; fail=1; }
          grep -q "| \*\*Skills\*\* | $SK |" documentation/content/docs/index.mdx || { echo "index.mdx: contagem de skills != $SK"; fail=1; }
          # Site: og:description (layout.tsx)
          grep -q "$CMD comandos, $AG agentes, $SK skills" documentation/app/layout.tsx || { echo "layout.tsx og:description: esperado '$CMD comandos, $AG agentes, $SK skills'"; fail=1; }
          # Site: cards da home (page.tsx)
          grep -q "font-bold\">$CMD<" documentation/app/page.tsx || { echo "page.tsx: card Comandos != $CMD"; fail=1; }
          grep -q "font-bold\">$AG<" documentation/app/page.tsx || { echo "page.tsx: card Agentes != $AG"; fail=1; }
          grep -q "font-bold\">$SK<" documentation/app/page.tsx || { echo "page.tsx: card Skills != $SK"; fail=1; }
          exit $fail

      - name: Markdown lint (ruleset minimo)
        run: npx -y markdownlint-cli2@0.23.1 "**/*.md"
